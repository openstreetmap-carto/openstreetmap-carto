version: '2'
services:
  kosmtik:
    image: openstreetmap-carto-kosmtik:v1
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/openstreetmap-carto
    depends_on:
      - db
    ports:
      - "127.0.0.1:6789:6789"
    environment:
      - PGHOST=db
      - PGUSER=postgres
  db:
    image: openstreetmap-carto-db:v1
    build:
      context: .
      dockerfile: Dockerfile.db
    shm_size: 1g
    command: postgres -c max_connections=200
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PG_WORK_MEM
      - PG_MAINTENANCE_WORK_MEM
      - PG_MAX_WORKER_PROCESSES
      - PG_MAX_PARALLEL_WORKERS
      - PG_MAX_PARALLEL_WORKERS_PER_GATHER
      - PG_JIT
  import:
    image: openstreetmap-carto-import:v1
    build:
      context: .
      dockerfile: Dockerfile.import
    volumes:
      - .:/openstreetmap-carto
    depends_on:
      - db
    environment:
      - PGHOST=db
      - PGUSER=postgres
      - PG_WORK_MEM
      - PG_MAINTENANCE_WORK_MEM
      - OSM2PGSQL_CACHE
      - OSM2PGSQL_NUMPROC
      - OSM2PGSQL_DATAFILE
      - EXTERNAL_DATA_SCRIPT_FLAGS
